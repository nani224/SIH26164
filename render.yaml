services:
  # 1. FastAPI Backend Service (Docker)
  - type: web
    name: ecdat-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: ECDAT_AIRGAP
        value: "1"
      - key: ECDAT_DEV_MODE
        value: "1"
      - key: ECDAT_API_TOKEN
        value: "ecdat-dev-insecure-token"
      - key: PORT
        value: "8000"

