name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.17"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Typecheck (mypy --strict)
        run: uv run mypy --strict .

      - name: Test + coverage
        run: uv run pytest --cov=api --cov=engine --cov=scripts --cov-report=term-missing --cov-fail-under=85

      - name: Contract diff (generated OpenAPI vs contracts/openapi.yaml)
        run: uv run python scripts/contract_diff.py
