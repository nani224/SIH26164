services:
  test-target-legacy-tls:
    image: nginx:alpine
    container_name: test-target-legacy-tls
    ports:
      - "8443:443"
    environment:
      - TLS_PROFILE=legacy
    command: >
      /bin/sh -c "
      mkdir -p /etc/nginx/ssl &&
      apk add --no-cache openssl &&
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        -keyout /etc/nginx/ssl/server.key -out /etc/nginx/ssl/server.crt \
        -subj '/CN=test-target-legacy-tls' &&
      cat << 'EOF' > /etc/nginx/conf.d/default.conf
      server {
          listen 443 ssl;
          ssl_certificate /etc/nginx/ssl/server.crt;
          ssl_certificate_key /etc/nginx/ssl/server.key;
          ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
          ssl_ciphers 'ECDHE-RSA-AES128-SHA:AES128-SHA:DES-CBC3-SHA:RC4-SHA';
          ssl_prefer_server_ciphers on;
          location / {
              return 200 'legacy-tls-ok\n';
          }
      }
      EOF
      nginx -g 'daemon off;'
      "

  test-target-modern-tls:
    image: nginx:alpine
    container_name: test-target-modern-tls
    ports:
      - "8444:443"
    environment:
      - TLS_PROFILE=modern
    command: >
      /bin/sh -c "
      mkdir -p /etc/nginx/ssl &&
      apk add --no-cache openssl &&
      openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
        -keyout /etc/nginx/ssl/server.key -out /etc/nginx/ssl/server.crt \
        -subj '/CN=test-target-modern-tls' &&
      cat << 'EOF' > /etc/nginx/conf.d/default.conf
      server {
          listen 443 ssl;
          ssl_certificate /etc/nginx/ssl/server.crt;
          ssl_certificate_key /etc/nginx/ssl/server.key;
          ssl_protocols TLSv1.3;
          ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256';
          ssl_prefer_server_ciphers off;
          location / {
              return 200 'modern-tls-ok\n';
          }
      }
      EOF
      nginx -g 'daemon off;'
      "

  test-target-legacy-ssh:
    image: alpine:latest
    container_name: test-target-legacy-ssh
    ports:
      - "2222:22"
    environment:
      - SSH_PROFILE=legacy
    command: >
      /bin/sh -c "
      apk add --no-cache openssh &&
      ssh-keygen -A &&
      cat << 'EOF' >> /etc/ssh/sshd_config
      Port 22
      KexAlgorithms diffie-hellman-group1-sha1,diffie-hellman-group14-sha1,curve25519-sha256
      Ciphers 3des-cbc,aes128-cbc,aes128-ctr,aes256-ctr
      MACs hmac-sha1,hmac-sha2-256
      PermitRootLogin yes
      PasswordAuthentication yes
      EOF
      echo 'root:rootpassword' | chpasswd &&
      /usr/sbin/sshd -D -e
      "
