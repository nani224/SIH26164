[project]
name = "ecdat-backend"
version = "0.1.0"
description = "ECDAT (Enterprise Cryptographic Discovery & Analysis Tool) backend — SIH26164"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "uvicorn[standard]>=0.32.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.2",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "sqlmodel>=0.0.42",
    "python-multipart>=0.0.32",
    "tree-sitter-go>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "websockets>=13.1",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "jsonschema>=4.23.0",
    "openapi-spec-validator>=0.7.1",
    "hypothesis>=6.168.0",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["bench/fixtures", "bench/real_world/samples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
exclude = ["^bench/fixtures/", "^bench/real_world/samples/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "api", "scripts", "bench"]
