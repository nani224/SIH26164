openapi: 3.1.0
info:
  title: ECDAT API
  version: "1.0.1"
  description: >
    Enterprise Cryptographic Discovery & Analysis Tool (SIH26164) API contract.
    Phase 0: this contract is implemented by an in-memory stub (see
    backend/api/), not a real detection engine. Examples on Finding/Scan/etc
    are hand-built, internally consistent with the Mosca risk formula, and
    explicitly NOT measured detector output (no engine exists yet).
servers:
  - url: /api/v1
    description: Relative to backend host; full generated paths (used by contract_diff) are under /api/v1.

security:
  - bearerAuth: []

paths:
  /api/v1/health:
    get:
      security: []
      operationId: health
      summary: Liveness/readiness check
      tags: [system]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /api/v1/scans:
    post:
      operationId: createScan
      summary: Start a new scan
      tags: [scans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanCreate"
      responses:
        "201":
          description: Scan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
    get:
      operationId: listScans
      summary: List scans
      tags: [scans]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scan"

  /api/v1/scans/upload:
    post:
      operationId: uploadScan
      summary: Upload an archive (.zip, .tar, .tar.gz, .tgz) for sandboxed extraction and scanning
      tags: [scans]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Source bundle archive (.zip, .tar, .tar.gz, .tgz)
                policyId:
                  type: string
                  description: Optional policy ID to enforce
                crqcYears:
                  type: integer
                  minimum: 5
                  maximum: 15
                  default: 10
                  description: Cryptographically Relevant Quantum Computer arrival horizon
      responses:
        "201":
          description: Scan created from uploaded archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/scans/{scan_id}:
    get:
      operationId: getScan
      summary: Get a scan by id
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/scans/{scan_id}/events:
    x-websocket: true
    description: >
      WebSocket endpoint (not representable as a standard OpenAPI 3.1
      operation). Emits ScanEvent JSON frames: {type: progress|finding|stage|done|error, eventId, ...}.
      See components.schemas.ScanEvent. Events are the real, stored record
      of what the scan did (not simulated) and are replayed after
      POST /scans returns -- scanning is currently synchronous, so there
      is nothing to stream live yet. Accepts an optional `after` query
      param (the last eventId already seen by the client, as an integer;
      omit or 0 for "from the start") to resume without re-sending events
      already delivered. Delivery is rate-limited to <=10 messages/sec.

  /api/v1/scans/{scan_id}/findings:
    get:
      operationId: getFindings
      summary: List/filter findings for a scan
      tags: [findings]
      parameters:
        - $ref: "#/components/parameters/ScanId"
        - name: band
          in: query
          schema: { $ref: "#/components/schemas/RiskBand" }
        - name: family
          in: query
          schema: { $ref: "#/components/schemas/Family" }
        - name: surface
          in: query
          schema: { $ref: "#/components/schemas/Surface" }
        - name: source
          in: query
          schema: { $ref: "#/components/schemas/FindingSource" }
        - name: minConfidence
          in: query
          schema: { type: number, minimum: 0, maximum: 1 }
        - name: needsReview
          in: query
          schema: { type: boolean }
        - name: q
          in: query
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: sort
          in: query
          schema: { type: string, enum: [score, path, family] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingPage"

  /api/v1/scans/{scan_id}/rescore:
    post:
      operationId: rescoreScan
      summary: Recompute risk bands from stored factors (no re-detection)
      tags: [findings]
      parameters:
        - $ref: "#/components/parameters/ScanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescoreRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescoreResult"

  /api/v1/scans/{scan_id}/graph:
    get:
      operationId: getGraph
      summary: System/file/asset graph for a scan
      tags: [scans]
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Graph"

  /api/v1/scans/{scan_id}/cbom:
    get:
      operationId: getCbom
      summary: CycloneDX 1.6 Cryptography BOM export
      tags: [exports]
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: CycloneDX 1.6 BOM
          content:
            application/json:
              schema:
                type: object
                description: CycloneDX 1.6 BOM. See https://cyclonedx.org/docs/1.6/json/ for the full schema.

  /api/v1/scans/{scan_id}/plan:
    get:
      operationId: getPlan
      summary: Remediation plan for a scan
      tags: [exports]
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemediationPlan"

  /api/v1/scans/{scan_id}/report.pdf:
    get:
      operationId: getReportPdf
      summary: Executive PDF report [Proposed full implementation is Phase 9; Phase 0 returns a placeholder PDF]
      tags: [exports]
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: PDF report
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /api/v1/findings/{finding_id}/triage:
    patch:
      operationId: patchFindingTriage
      summary: Update triage status/note for a finding
      tags: [findings]
      parameters:
        - name: finding_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriagePatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Finding"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/policies:
    get:
      operationId: listPolicies
      summary: List policies
      tags: [policies]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Policy"
    put:
      operationId: upsertPolicy
      summary: Create or replace a policy (id taken from the body)
      tags: [policies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"

  /api/v1/policies/{policy_id}:
    get:
      operationId: getPolicy
      summary: Get a policy by id
      tags: [policies]
      parameters:
        - name: policy_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: putPolicy
      summary: Replace a policy at a specific id
      tags: [policies]
      parameters:
        - name: policy_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Policy"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"

  /api/v1/catalog/pqc:
    get:
      operationId: getPqcCatalog
      summary: Reference catalog of standardized PQC algorithms (FIPS 203/204/205)
      tags: [catalog]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PqcCatalogEntry"

  /api/v1/targets:
    get:
      operationId: listTargets
      summary: List all monitored scan targets
      tags: [targets]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Target"
    post:
      operationId: createTarget
      summary: Register a new scan target
      tags: [targets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetCreate"
      responses:
        "201":
          description: Target created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"

  /api/v1/targets/{id}:
    get:
      operationId: getTarget
      summary: Get target by id
      tags: [targets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchTarget
      summary: Update target configuration
      tags: [targets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Target"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTarget
      summary: Delete target
      tags: [targets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Target deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/targets/{id}/scan-now:
    post:
      operationId: scanTargetNow
      summary: Trigger an immediate scan for a target
      tags: [targets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Scan created and executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/targets/{id}/snapshots:
    get:
      operationId: listTargetSnapshots
      summary: List snapshots for a target
      tags: [targets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/targets/{id}/drift:
    get:
      operationId: getTargetDrift
      summary: Calculate cryptographic drift between two snapshots of a target
      tags: [targets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          required: true
          schema: { type: string }
          description: Baseline snapshot ID
        - name: to
          in: query
          required: true
          schema: { type: string }
          description: Target snapshot ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Drift"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/alerts:
    get:
      operationId: listAlerts
      summary: List all active and historical alerts
      tags: [alerts]
      parameters:
        - name: acknowledged
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /api/v1/alerts/{id}/acknowledge:
    patch:
      operationId: acknowledgeAlert
      summary: Acknowledge an alert
      tags: [alerts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/probes/tls:
    post:
      operationId: probeTls
      summary: Probe an endpoint for TLS cryptographic configuration
      tags: [probes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/probes/ssh:
    post:
      operationId: probeSsh
      summary: Probe an endpoint for SSH cryptographic configuration
      tags: [probes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/probes:
    get:
      operationId: listProbeResults
      summary: List historical probe results
      tags: [probes]
      parameters:
        - name: targetId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProbeResult"

  /api/v1/hsm/inventory:
    get:
      operationId: getHsmInventory
      summary: Enumerate PKCS#11 / SoftHSM2 cryptographic keys and slots
      tags: [hsm]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HsmInventory"

  /api/v1/estate/summary:
    get:
      operationId: getEstateSummary
      summary: High-level cryptographic estate posture and PQC readiness summary
      tags: [estate]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstateSummary"

  /api/v1/estate/trend:
    get:
      operationId: getEstateTrend
      summary: Historical estate risk trend over time
      tags: [estate]
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstateTrend"

  /api/v1/audit/verify:
    get:
      operationId: verifyAuditChain
      summary: Verify the cryptographic SHA-256 hash integrity of the audit log chain
      tags: [audit]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditVerifyResponse"

  /api/v1/scans/{scan_id}/coverage:
    get:
      operationId: getScanCoverage
      summary: Get crypto mass conservation coverage certificate for a scan
      tags: [coverage]
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageCertificate"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/scans/{scan_id}/coverage/artifacts:
    get:
      operationId: getScanArtifactCoverage
      summary: Get per-artifact crypto mass conservation coverage for a scan
      tags: [coverage]
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArtifactCoverage"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/residue:
    get:
      operationId: listResidueClusters
      summary: List crypto debt residue clusters across scans and targets
      tags: [debt]
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ResidueClusterState"
        - name: targetId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResidueCluster"

  /api/v1/residue/{id}:
    get:
      operationId: getResidueCluster
      summary: Get details of a specific crypto debt residue cluster
      tags: [debt]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidueCluster"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchResidueCluster
      summary: Transition state of a residue cluster (open -> promoted | excluded | accepted)
      tags: [debt]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidueClusterPatch"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidueCluster"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/criticality:
    get:
      operationId: listAssetCriticalities
      summary: List asset business criticalities and ownership mappings
      tags: [criticality]
      parameters:
        - name: targetId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetCriticality"
    put:
      operationId: setAssetCriticality
      summary: Set or update asset business criticality mapping
      tags: [criticality]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCriticality"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetCriticality"

  /api/v1/criticality/import:
    post:
      operationId: importAssetCriticalityCsv
      summary: Import asset business criticalities from CSV (CMDB bulk load)
      tags: [criticality]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriticalityImportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/cloud/keys:
    get:
      operationId: listCloudKeys
      summary: Discover cryptographic keys from cloud providers (AWS KMS via LocalStack)
      tags: [cloud]
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudKeysResponse"

  /api/v1/estate/coverage:
    get:
      operationId: getEstateCoverage
      summary: Get aggregated crypto coverage and debt trends across the estate
      tags: [estate]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstateCoverage"


components:
  parameters:
    ScanId:
      name: scan_id
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"

  schemas:
    ErrorDetail:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }

    FindingKind:
      type: string
      enum: [algorithm, certificate, key, protocol, library]
    Surface:
      type: string
      enum: [source, binary, certificate, config, image, manifest, hardware-hsm]
    Family:
      type: string
      enum:
        [RSA, DSA, DH, ECDH, ECDSA, Ed25519, X25519, AES, ChaCha20, "3DES",
         DES, RC4, Blowfish, MD5, "SHA-1", "SHA-2", "SHA-3", HMAC,
         ML-KEM, ML-DSA, SLH-DSA]
    CryptoFunction:
      type: string
      enum: [keygen, encrypt, decrypt, sign, verify, digest, tag, keyderive, unknown]
    FindingSource:
      type: string
      enum:
        [ast, ast-reference, ast-protocol-string, source-constant,
         binary-symbol, binary-constant, binary-oid, x509-parser,
         pem-parser, ssh-key-parser, config-parser, manifest]
    TriageStatus:
      type: string
      enum: [open, accepted-risk, false-positive, fixed]
    ScanStatus:
      type: string
      enum: [queued, ingesting, scanning, scoring, done, failed]
    RiskBand:
      type: string
      enum: [critical, high, medium, low]
    Exposure:
      type: string
      enum: [external, internal, isolated, test]
    Criticality:
      type: string
      enum: [mission-critical, high, medium, low]
    GraphNodeType:
      type: string
      enum: [system, file, asset]

    Location:
      type: object
      required: [path]
      properties:
        path: { type: string }
        line: { type: [integer, "null"] }
        offset: { type: [integer, "null"] }
        layer: { type: [string, "null"] }

    RiskCost:
      type: object
      required: [pkBytesDelta, wireBytesDelta, opMsDelta]
      properties:
        pkBytesDelta: { type: integer }
        wireBytesDelta: { type: integer }
        opMsDelta: { type: number }

    Recommendation:
      type: object
      required: [action, cost]
      properties:
        action: { type: string }
        target: { type: [string, "null"] }
        cost: { $ref: "#/components/schemas/RiskCost" }

    Risk:
